[project]
name = "quantum"
version = "0.1.0"
description = "Quantum-assisted emergency vehicle routing for time-critical ambulance dispatch"
readme = "README.md"
authors = [
    { name = "Abban C Varughese", email = "abban.varughese@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.16.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "networkx>=3.2.1",
    "numpy>=1.26.0",
    "osmnx>=2.0.0",
    "pydantic>=2.7.0",
    "pylatexenc>=2.11",
    "pyyaml>=6.0.1",
    "qiskit>=2.6.1",
    "qiskit-aer>=0.18.2",
    "requests>=2.31.0",
    "scipy>=1.12.0",
    "streamlit>=1.35.0",
    "streamlit-folium>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
quantum = "quantum:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
